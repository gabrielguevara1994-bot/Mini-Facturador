<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <!-- Permite que la página se adapte a celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Facturador Ecuador</title>
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>
   
    <h1>Mini Facturador Ecuador</h1>

    <section class="contenedor">

        <h2>Datos del Emisor</h2>

        <div class="datos-emisor">

          
            <p>
                <strong>Nombre:</strong>
                Gabriel Antonio Endara Guevara

            </p>

            <p>

                <strong>RUC:</strong>

                1723441703

            </p>

            <p>

                <strong>Dirección:</strong>

                Quito, Isabel Herreria y S34K OE13-120

            </p>

        </div>

    </section>

    <section class="contenedor">

        <h2>Datos de la Factura</h2>

   
        <div class="fila">

            <div class="campo">

                <label for="numeroFactura">

                    Número de Factura

                </label>

                <!--
                    Input donde aparece el número de factura.

                    id:
                    Identifica este elemento para JavaScript.

                    value:
                    Define un valor inicial.
                -->
                <input
                    type="text"
                    id="numeroFactura"
                    value="001-001-000000001"
                >

            </div>

            <!-- CAMPO: FECHA -->

            <div class="campo">

                <label for="fecha">

                    Fecha

                </label>

                <!--
                    type="date" crea un selector de fecha.
                -->
                <input
                    type="date"
                    id="fecha"
                >

            </div>

        </div>

    </section>

    <section class="contenedor">

        <h2>Datos del Cliente</h2>

        <!-- Primera fila de datos -->
        <div class="fila">

            <!-- IDENTIFICACIÓN -->

            <div class="campo">

                <label for="identificacionCliente">

                    Cédula / RUC

                </label>

                <!--
                    El usuario ingresará aquí
                    la identificación del cliente.
                -->
                <input
                    type="text"
                    id="identificacionCliente"
                    placeholder="Cédula o RUC"
                >

            </div>

            <!-- NOMBRE -->

            <div class="campo">

                <label for="nombreCliente">

                    Nombre / Razón Social

                </label>

                <input
                    type="text"
                    id="nombreCliente"
                    placeholder="Nombre del cliente"
                >

            </div>

        </div>

        <!-- DIRECCIÓN DEL CLIENTE -->

        <div class="campo">

            <label for="direccionCliente">

                Dirección

            </label>

            <input
                type="text"
                id="direccionCliente"
                placeholder="Dirección del cliente"
            >

        </div>

        <!-- CORREO DEL CLIENTE -->

        <div class="campo">

            <label for="correoCliente">

                Correo

            </label>

            <input
                type="email"
                id="correoCliente"
                placeholder="correo@ejemplo.com"
            >

        </div>

    </section>

    <section class="contenedor">

        <h2>Detalle de la Factura</h2>

        <!--
            Tabla donde aparecerán los productos
            agregados por el usuario.
        -->
        <table>

            <!-- ENCABEZADO DE LA TABLA -->

            <thead>

                <tr>

                    <th>Cantidad</th>

                    <th>Descripción</th>

                    <th>Precio</th>

                    <th>IVA</th>

                    <th>Total</th>

                    <th>Acción</th>

                </tr>

            </thead>

            <!--
                Aquí JavaScript agregará dinámicamente
                las filas de productos.
            -->
            <tbody id="listaProductos">

            </tbody>

        </table>

        <!--
            Al hacer clic se ejecutará
            la función agregarProducto().
        -->
        <button
            type="button"
            onclick="agregarProducto()"
        >

            + Agregar Producto

        </button>

    </section>
